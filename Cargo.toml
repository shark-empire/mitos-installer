[package]
name = "mitos-installer"
version = "0.1.0"
edition = "2021"
authors = ["Shark <babor3331@gmail.com>"]
description = "The system installer for MITOS"

[dependencies]
dialoguer = "0.11"
indicatif = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
nix = { version = "0.28", features = ["mount", "fs"] }

